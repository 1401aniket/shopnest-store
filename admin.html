<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopnest admin</title><link rel="stylesheet" href="styles.css"><style>body{padding:40px 6%;max-width:1100px;margin:auto}.admin-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:25px;margin-bottom:35px}.admin-grid{display:grid;grid-template-columns:380px 1fr;gap:40px}.admin-panel{background:#fff;padding:25px;border:1px solid var(--line)}.admin-panel h1,.admin-panel h2{font-family:'Playfair Display',serif;margin-top:0}.admin-form{display:grid;gap:12px}.admin-form input,.admin-form select{border:1px solid var(--line);padding:12px;background:var(--paper);font:13px 'DM Sans'}.admin-form button{border:0}.admin-help{font-size:12px;color:var(--muted);line-height:1.5}.admin-table{width:100%;border-collapse:collapse}.admin-table th,.admin-table td{text-align:left;border-bottom:1px solid var(--line);padding:12px 8px;font-size:12px}.admin-table img{width:45px;height:45px;object-fit:cover;margin-right:4px}.danger{color:#b33b29;text-decoration:underline}.status{min-height:20px;color:var(--coral);font-size:12px}@media(max-width:800px){body{padding:25px 5%}.admin-grid{grid-template-columns:1fr}.admin-table{display:block;overflow:auto;white-space:nowrap}}</style></head><body><div class="admin-head"><a class="brand" href="index.html"><span class="brand-mark">s</span><span>shopnest</span></a><span class="eyebrow">PRIVATE ADMIN</span></div><div class="admin-grid"><section class="admin-panel"><h1>Manage products</h1><p class="admin-help">Add up to four product photos. This private panel needs the admin key configured in the backend.</p><form class="admin-form" id="productForm"><input name="adminKey" type="password" placeholder="Admin key" required><input name="id" type="number" placeholder="Product ID" required><input name="name" placeholder="Product name" required><select name="category"><option>Home</option><option>Style</option><option>Tech</option><option>Wellness</option><option>Gifts</option></select><input name="price" type="number" min="1" placeholder="Price in INR" required><input name="stock" type="number" min="0" placeholder="Stock quantity" required><input name="photos" type="file" accept="image/*" multiple required><button class="primary-button" type="submit">Save product <span>→</span></button><p class="status" id="status"></p></form></section><section class="admin-panel"><h2>Current products</h2><div id="products">Loading…</div></section></div><script src="admin.js"></script></body></html>
